/* v2.3: container header / nested destinations / original chat. Candidate, not host pixels. */
:root{--topic-head:#f4f4f4;--topic-icon:#e8e8e8;--branch:#d8d8d8}
[data-theme=dark]{--topic-head:#2b2b2b;--topic-icon:#3b3b3b;--branch:#4b4b4b}
.board{padding:24px;max-width:1240px;margin:0}
.topic{border-radius:13px;border:1px solid var(--line);background:var(--bg)}
.topichead{min-height:50px;padding:0 9px 0 15px;background:var(--topic-head);border-bottom:1px solid var(--line);gap:5px}
.topic.folded .topichead{border-bottom-color:transparent}
.topic-heading{flex:1;min-width:0;margin:0}
.topiclabel{display:flex;width:100%;min-height:50px;padding:8px 0;gap:11px;text-align:left}
.topiclabel:hover{background:transparent}
.topiclabel .topic-symbol{height:26px;width:26px;display:grid;place-items:center;border-radius:8px;background:var(--topic-icon);flex:none}
.topiclabel .topic-symbol svg{width:17px;height:17px;color:var(--text);opacity:1}
.topiclabel .topic-name{font-size:15px;line-height:22px;font-weight:600;overflow-wrap:anywhere;flex:1;min-width:0}
.topiclabel .disclosure{margin-left:auto;display:flex;flex:none}
.topiclabel .disclosure svg{width:14px;height:14px;opacity:1}
.topic-menu{opacity:0;width:28px;flex:none}
.topic-contents{padding:10px 10px 9px 14px}
.window-list{border-left:1px solid var(--branch);margin:0 0 0 14px;padding:0 0 0 9px}
.window-list .row{min-height:36px;position:relative;padding:0 0 0 3px}
.window-list .row::before{content:"";position:absolute;left:-10px;top:18px;width:7px;border-top:1px solid var(--branch);pointer-events:none}
.rowmain{display:flex;align-items:center;gap:8px;min-height:36px;padding:7px 3px 7px 6px;line-height:22px}
.rowmain .window-symbol{display:flex;flex:none;color:var(--muted)}
.rowmain .window-symbol svg{width:14px;height:14px}
.rowmain .title{font-size:14px;line-height:22px;min-width:0;flex:1}
.rowmain .enter{color:var(--muted);display:flex;flex:none;opacity:0}
.rowmain .enter svg{width:13px;height:13px}
.rowmain:hover .enter,.rowmain:focus-visible .enter{opacity:1}
.row:hover .rowmain{background:transparent}
.card-tail{padding:3px 4px 0 29px;gap:4px 13px;margin-top:1px}
.card-tail .expand{font-size:12px;min-height:28px;line-height:20px}
.subgroup.is-expanded{padding-top:5px;margin-top:5px}
.subrows{margin:3px 0 3px -15px}
.subrows .window-list{margin-left:14px}
.focuscard{max-width:640px}
#workset{display:none!important}
.scene-option{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:9px;text-align:left;margin:8px 0;display:block}
.scene-option small{display:block;color:var(--muted);margin-top:4px}
.scene-option[aria-pressed=true]{background:var(--selected)}
[data-equal-type=true] .topic-name,[data-equal-type=true] .rowmain .title{font-size:14px!important;font-weight:400!important}
@media(pointer:coarse){.window-list .row,.rowmain{min-height:44px}.window-list .row::before{top:22px}.topic-menu{opacity:1}.row .more{width:36px;height:40px}.topiclabel{min-height:60px}.card-tail .expand{min-height:40px}.enter{display:none!important}}
@media(max-width:760px){.board{padding:16px 12px}.topichead{padding-left:12px}.topiclabel{gap:9px}.topic-menu{opacity:1}.topic-contents{padding-left:10px}.card-tail{padding-left:25px}.rowmain{gap:6px}.rowmain .enter{display:none}}
