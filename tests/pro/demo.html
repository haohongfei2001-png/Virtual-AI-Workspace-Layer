<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VAIWL Pro R1 · 离线工程候选</title>
<style>
@font-face{font-family:'PingFang SC';src:url('/__fixture-font.ttf');font-weight:100 900}*{box-sizing:border-box}html,body{margin:0;height:100%;font:14px 'PingFang SC',system-ui,sans-serif;color:#262626;background:#fff}body{display:flex;flex-direction:column}header{display:flex;align-items:center;gap:14px;padding:12px 20px;border-bottom:1px solid #e6e6e6;flex-wrap:wrap}header strong{font-size:16px;font-weight:600}header small{color:#6b6b6b;flex:1}button{font:inherit;border:1px solid #ddd;border-radius:8px;background:transparent;color:inherit;padding:7px 10px;cursor:pointer}iframe{border:0;width:100%;flex:1;min-height:0}#native-reading{flex:none;border-top:1px solid #e6e6e6;padding:12px 20px;display:flex;gap:20px;align-items:center;background:#fafafa}#native-reading label{font-size:12px;color:#666;flex:none}textarea{font:inherit;resize:none;border:1px solid #ddd;border-radius:9px;background:#fff;padding:10px;min-height:54px;flex:1}#result{max-width:44%;max-height:80px;overflow:auto;font-size:11px;white-space:pre-wrap} @media(max-width:650px){header{padding:8px;gap:7px}header small{font-size:10px}#native-reading{padding:8px;gap:8px}#native-reading label{max-width:70px}#result{display:none}}@media(prefers-color-scheme:dark){html,body{color:#eee;background:#212121}header,#native-reading{border-color:#444}header small,#native-reading label{color:#aaa}#native-reading{background:#171717}button,textarea{background:#262626;color:#eee;border-color:#444}}
</style></head><body>
<header><strong>VAIWL Pro</strong><small>R1 独立工程候选 · 合成样本 · 本地规则建议 · 不调用云模型</small><button id="journey">运行连续旅程</button><button id="new-fixture">新建空白样本</button></header>
<iframe id="pro-frame" title="VAIWL Pro 工作区"></iframe>
<section id="native-reading" aria-label="保留的样例阅读与输入区"><label for="native-draft">独立样例输入区<br>切换时保留草稿</label><textarea id="native-draft" placeholder="这里是隔离测试输入，不连接真实聊天。"></textarea><output id="result" aria-live="polite"></output></section>
<script type="module" src="/tests/pro/demo.mjs"></script>
</body></html>
