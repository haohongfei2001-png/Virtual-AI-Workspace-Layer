function row(c,global=false){let s=classify(c),d=lastIn(c),title=display(c.id);if(!global&&ws(state.topic||members(c.id)[0]))title=title.replace(new RegExp('^'+(ws(state.topic||members(c.id)[0]).name.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'))+' '),'');return `<div class="row ${state.current===c.id?'is-current':''}" draggable="${state.mode==='derived'}" data-drag="${c.id}"><button class="rowmain" data-open="${c.id}" title="${esc(display(c.id))}"><span class="title">${esc(title)}${db().locks[c.id]?' · 已保护':''}${db().pinnedChats.includes(c.id)?' · 固定':''}</span><span class="meta">${esc(c.project)}${s==='unknown'||s==='all'&&(!eligible(c).length||!c.complete)?' · 时间待确认':s==='outside'?' · 区间外':''}</span></button><span class="rowtime">${d?localDay(d,state.zone).slice(5).replace('-','/'):'—'}</span><button class="icon more" data-detail="${c.id}" aria-label="${esc(display(c.id))} 的信息与操作">${svg('more')}</button></div>`}
function sorted(c){return [...c].sort((a,b)=>(lastIn(b)||'').localeCompare(lastIn(a)||'')||a.id.localeCompare(b.id))}
function topicCard(t,full=false){let list=items(t.id),s=topicState(t.id),visible=sorted(list.filter(c=>['active','all'].includes(classify(c)))),outside=list.filter(c=>classify(c)==='outside'),unknown=list.filter(c=>classify(c)==='unknown'),fixed=list.filter(c=>db().pinnedChats.includes(c.id)&&!visible.includes(c)),limit=state.limits[t.id]||(full?12:4),folded=state.collapsed[t.id]===true;
let main=visible.length?visible: s==='outside'?outside:unknown;let current=state.current&&members(state.current).includes(t.id);let more=main.length>limit;
return `<article class="topic ${current?'is-current':''}" data-topic="${t.id}" data-status="${s}" data-drop="${t.id}"><header class="topichead"><button class="topiclabel" data-fold="${t.id}" aria-expanded="${!folded}" aria-controls="body-${t.id}">${svg(folded?'right':'down')}<strong>${esc(t.name)}</strong></button>${pinned(t.id)?'<span class="tag">固定</span>':''}<span class="count">${visible.length?visible.length+' / ':''}${list.length}</span><button class="icon" data-topic-menu="${t.id}" aria-label="${esc(t.name)} 主题菜单" aria-haspopup="menu">${svg('more')}</button></header><div id="body-${t.id}" ${folded?'hidden':''}><div class="topicsource">${new Set(list.map(c=>c.project)).size} 个原生来源 · ${labelStatus(s)}${!list.every(c=>c.complete)?' · 覆盖不完整':''}</div><div class="rows">${fixed.length?'<div class="small muted" style="padding:6px 9px">固定对话 · 不计为活跃</div>'+fixed.map(c=>row(c)).join(''):''}${main.filter(c=>!fixed.includes(c)).slice(0,limit).map(c=>row(c)).join('')}${!main.length?'<div class="empty">尚无可判定的对话</div>':''}${more?`<button class="expand" data-more="${t.id}">再显示 ${Math.min(12,main.length-limit)} 条 · 还有 ${main.length-limit} 条</button>`:''}${visible.length&&outside.length?subgroup(t.id,'outside',outside.filter(c=>!fixed.includes(c)),full):''}${visible.length&&unknown.length?subgroup(t.id,'unknown',unknown.filter(c=>!fixed.includes(c)),full):''}${s==='unknown'&&outside.length?subgroup(t.id,'outside',outside,full):''}${!full&&list.length>12?`<button class="expand" data-focus="${t.id}">单独查看此主题 ${svg('right')}</button>`:''}</div></div></article>`}
function subgroup(id,type,list){if(!list.length)return '';const key=id+':'+type,on=state.expanded[key],n=state.limits[key]||12;return `<div class="subgroup"><button class="expand" data-expand="${key}" aria-expanded="${!!on}">${svg(on?'down':'right')} ${type==='unknown'?'时间待确认':'历史与区间外对话'} · ${list.length}</button>${on?list.slice(0,n).map(c=>row(c)).join('')+(n<list.length?`<button class="expand" data-more="${key}">再显示 ${Math.min(12,list.length-n)} 条 · 还有 ${list.length-n} 条</button>`:''):''}</div>`}

function renderNav(){let ts=spaces().filter(t=>pinned(t.id)||['active','all'].includes(topicState(t.id)));$('sidebar').innerHTML=`<div class="sidehead">ChatGPT <button class="icon" data-action="nav" aria-label="收起导航">☰</button></div><button class="nav" data-action="new">${svg('plus')}新聊天</button><button class="nav" data-action="search">${svg('search')}搜索聊天</button><button class="nav ${state.view==='topics'?'selected':''}" data-action="topics">${svg('folder')}主题 <span class="thirdparty">VAIWL</span></button><button class="nav" data-action="workset">${svg('chat')}当前工作集</button>${state.mode==='derived'?'<div class="navcaption">'+(state.offset?'区间中的主题':'主题快捷入口')+'</div>'+ts.slice(0,8).map(t=>`<button class="nav" data-focus="${t.id}" data-drop="${t.id}">${esc(t.name)}</button>`).join('')+(ts.length>8?`<button class="nav muted" data-action="topics">查看其余 ${ts.length-8} 个</button>`:''):'<div class="navcaption">原生 Projects（示意）</div>'+[...new Set(all().map(c=>c.project))].slice(0,6).map(p=>`<button class="nav" data-action="nativeHelp">${esc(p)}</button>`).join('')}<div class="sidefoot"><button class="nav" data-action="nativeHelp">${svg('folder')}ChatGPT 原生功能</button><button class="nav" data-action="account">${state.account==='A'?'个人示例账户':'团队示例账户'}</button><p>VAIWL · 第三方扩展<br>交互原型，不连接真实账户</p></div>`}
function renderToolbar(){const r=range(),names={1:'最近一个月',3:'最近三个月',12:'最近一年',all:'全部历史'};$('toolbar').hidden=state.mode==='native';$('toolbar').innerHTML=`<div class="range"><button class="button" id="range-menu" data-action="rangeMenu" aria-haspopup="menu">${names[state.months]} ${svg('down')}</button><button class="icon" data-action="prev" aria-label="查看上一段" ${state.months==='all'?'disabled':''}>‹</button><button class="icon" data-action="next" aria-label="查看后一段" ${state.offset===0||state.months==='all'?'disabled':''}>›</button>${state.offset?'<button class="button" data-action="latest">回到最近</button>':''}<span class="dates" id="range-label">${r.start?`${r.start} — ${r.end}`:'全部已知历史 · 时间未知记录也可见'}</span></div><button class="small muted" data-action="clock">示例今天 ${state.today} · ${state.zone}</button>`}
function renderHost(){if(!state.current||!chat(state.current))return;let c=chat(state.current),key=state.account+':'+c.id;if(currentHostKey!==key){currentHostKey=key;$('host').innerHTML=`<div class="chathead"><div><div class="small muted" id="host-source"></div><h2 id="host-title"></h2></div><button class="icon" data-detail="${c.id}" aria-label="对话信息">${svg('more')}</button></div><div class="chatbody" id="transcript"><div class="userbubble">${esc(c.body||'继续这个主题的研究，保持原生 Project 和对话内容不变。')}</div><div class="answer"><h3>继续当前对话</h3><p>这是上一轮原型的原生聊天区示意。主题、标题和时间窗口只改变导航投影，不改变真实来源。</p><p>你可以切换月份、展开历史，或关闭派生显示。此示例会保留同一个聊天区和输入框节点。</p><p class="muted small">预写模拟回答 · 没有模型正在运行</p></div></div><div class="composerwrap"><div class="composer"><textarea id="composer" aria-label="演示输入框" placeholder="询问任何问题（仅演示，不发送）"></textarea><div class="composeractions"><button class="icon" data-action="nativeHelp" aria-label="附件说明">${svg('plus')}</button><button class="send" data-action="demoSend" aria-label="发送功能说明">${svg('up')}</button></div></div><p class="hint">模拟原生区域 · 不发送消息，不读取私人数据</p></div>`;$('composer').value=drafts[key]||'';$('composer').addEventListener('input',()=>drafts[key]=$('composer').value)}$('host-title').textContent=state.mode==='native'?native(c.id):display(c.id);$('host-source').textContent=c.project+' · '+(state.mode==='native'?'原始来源':'只改变显示，不合并上下文')}
function render(){renderNav();renderToolbar();renderBoard();renderHost();$('shell').classList.toggle('nav-open',state.nav);document.documentElement.dataset.theme=state.theme;document.querySelectorAll('[data-mode]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.mode===state.mode)));$('fault').hidden=!state.fault;$('host').hidden=state.view!=='chat';$('board-scroll').hidden=state.view==='chat';$('current').hidden=!state.current||state.mode==='native';if(state.current&&chat(state.current))$('current').innerHTML=`<span>正在查看${classify(chat(state.current))==='outside'?' · 区间外':classify(chat(state.current))==='unknown'?' · 时间待确认':''}</span><button data-open="${state.current}">${esc(display(state.current))}</button><span class="muted">保留访问，不改变活跃时间</span>`;$('workset').hidden=state.view!=='chat'||state.mode==='native';$('workset').innerHTML=db().tabs.filter(id=>chat(id)).slice(-8).map(id=>`<button data-open="${id}" aria-current="${id===state.current}">${esc(display(id))}</button>`).join('')}

function toast(text,undo=false){$('toast').hidden=false;$('toast').innerHTML=esc(text)+(undo?'<button data-action="undo">撤销</button>':'');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>$('toast').hidden=true,4500)}

function dialog(title,html){closeMenu(false);modalReturn=document.activeElement;$('modal').innerHTML=`<div class="dialoghead"><h2 id="modal-title">${esc(title)}</h2><button class="icon" data-action="close" aria-label="关闭">×</button></div><div class="dialogbody">${html}</div>`;if(!$('modal').open)$('modal').showModal();$('modal').querySelector('[autofocus]')?.focus()}

document.addEventListener('click',ev=>{const b=ev.target.closest('button');if(!b||b.disabled)return;if(b.dataset.open){if($('modal').open)closeDialog();return openChat(b.dataset.open)}if(b.dataset.mode){state.mode=b.dataset.mode;if(state.mode==='derived')state.fault=false;return render()}if(b.dataset.focus){closeMenu(false);state.topic=b.dataset.focus;state.view='focus';state.nav=false;return render()}if(b.dataset.fold){state.collapsed[b.dataset.fold]=!state.collapsed[b.dataset.fold];renderBoard();return}if(b.dataset.expand){state.expanded[b.dataset.expand]=!state.expanded[b.dataset.expand];renderBoard();return}if(b.dataset.more){let k=b.dataset.more;state.limits[k]=(state.limits[k]||(k.includes(':')||state.view==='focus'?12:4))+12;renderBoard();return}if(b.dataset.topicMenu){const id=b.dataset.topicMenu;return menu(b,`<button role="menuitem" data-pin-topic="${id}">${db().pins.includes(id)?'取消固定':'固定主题'}</button><button role="menuitem" data-focus="${id}">单独查看主题</button>`)}if(b.dataset.pinTopic){const id=b.dataset.pinTopic;closeMenu(false);mutate('固定只改变可见性，不计为活跃',()=>{db().pins=db().pins.includes(id)?db().pins.filter(x=>x!==id):[...db().pins,id]});return}if(b.dataset.detail)return detail(b.dataset.detail);if(b.dataset.pinChat){const id=b.dataset.pinChat;closeDialog();return mutate('已更新对话固定',()=>db().pinnedChats=db().pinnedChats.includes(id)?db().pinnedChats.filter(x=>x!==id):[...db().pinnedChats,id])}if(b.dataset.edit){const id=b.dataset.edit;return dialog('只修改显示标题',`<p>原生名称和发送时间不变；人工标题受保护。</p><input type="text" id="titleInput" value="${esc(display(id))}" autofocus><p class="error" id="error"></p><div class="actions"><button class="button" data-action="close">取消</button><button class="button primary" data-save-title="${id}">保存显示名</button></div>`)}if(b.dataset.saveTitle){let id=b.dataset.saveTitle,v=$('titleInput').value.trim();if(!v){$('error').textContent='名称不能为空';return}closeDialog();return mutate('已保存并保护显示名称',()=>{db().aliases[id]=[...new Set([...(db().aliases[id]||[]),display(id)])];db().titles[id]=v;db().locks[id]=true})}if(b.dataset.assign)return assign(b.dataset.assign);if(b.dataset.savePlacement){let id=b.dataset.savePlacement,v=[...$('modal').querySelectorAll('[name=placement]:checked')].map(x=>x.value),old=members(id);closeDialog();return mutate('已修改派生归属，时间和原生来源不变',()=>{db().placements[id]=v;db().excludes[id]=[...new Set([...(db().excludes[id]||[]),...old.filter(x=>!v.includes(x))])].filter(x=>!v.includes(x))})}if(b.dataset.range)return setRange(b.dataset.range);if(b.dataset.rename){let id=b.dataset.rename;plan={id,account:state.account,old:native(id),next:display(id)};return dialog('原生改名 · 仅模拟',`<p>此操作与显示改名完全分离。</p><div class="field">${esc(plan.old)} → ${esc(plan.next)}</div><label class="checkrow"><input id="consent" type="checkbox">仅允许这一次模拟修改</label><p id="writeError" class="error"></p><div class="actions"><button class="button" data-action="conflict">模拟外部冲突</button><button class="button primary" id="execute" data-action="execute" disabled>确认模拟修改</button></div>`)}
let a=b.dataset.action;switch(a){case'close':return closeDialog();case'nav':state.nav=!state.nav;return render();case'topics':state.view='topics';state.topic=null;state.nav=false;closeMenu(false);return render();case'workset':state.view='workset';return render();case'rangeMenu':return menu(b,[['1','最近一个月'],['3','最近三个月'],['12','最近一年'],['all','全部历史']].map(([v,l])=>`<button role="menuitemradio" aria-checked="${String(state.months)===v}" data-range="${v}">${l}${String(state.months)===v?' ✓':''}</button>`).join(''));case'prev':state.offset++;break;case'next':state.offset=Math.max(0,state.offset-1);break;case'latest':state.offset=0;break;case'history':state.history=!state.history;return renderBoard();case'unknown':state.unknown=!state.unknown;return renderBoard();case'collapseAll':{const allCollapsed=spaces().every(t=>state.collapsed[t.id]);spaces().forEach(t=>state.collapsed[t.id]=!allCollapsed);b.textContent=allCollapsed?'折叠全部':'展开全部';return renderBoard()}case'settings':return settings();case'search':return searchDialog();case'clock':return dialog('示例时间控制',`<p>原型固定示例今天，便于复验。正式产品以用户当地今天为锚点。</p><label>示例今天<input id="today" type="date" value="${state.today}"></label><label>时区<select id="zone">${['America/Chicago','Asia/Shanghai','America/New_York','UTC'].map(z=>`<option ${z===state.zone?'selected':''}>${z}</option>`).join('')}</select></label><div class="actions"><button class="button primary" data-action="saveClock">应用</button></div>`);case'saveClock':if(!$('today').value)return;state.today=$('today').value;state.zone=$('zone').value;state.offset=0;closeDialog();break;case'theme':state.theme=state.theme==='light'?'dark':'light';closeDialog();return render();case'saveSession':db().snapshot=[...db().tabs];closeDialog();return toast('已保存示例引用与顺序，不保存原生草稿');case'restore':db().tabs=[...new Set(db().snapshot)];state.view='workset';closeDialog();return render();case'account':return dialog('示例账户',`<p>仅两个内存集合，不证明真实账户绑定。</p><button class="nav" data-action="accountA">个人示例账户</button><button class="nav" data-action="accountB">团队示例账户</button>`);case'accountA':case'accountB':state.account=a==='accountA'?'A':'B';state.current=null;state.view='topics';state.topic=null;state.collapsed={};state.history=false;state.unknown=false;state.mode='derived';$('host').innerHTML='';currentHostKey=null;closeDialog();return render();case'import':return dialog('原版历史样本',`<p>${state.account==='B'?'这份样本不属于此账户，拒绝导入。':db().imported?'样本已导入，重复引用不会再次添加。':'载入原型自带的两个历史引用。时间和 Project 未核验，不假定活跃。'}</p>${state.account==='A'&&!db().imported?'<button class="button" data-action="confirmImport">载入示例</button>':''}`);case'confirmImport':db().imported=true;extras.forEach(c=>db().placements[c.id]=[c.ws]);closeDialog();return render();case'replayAI':closeDialog();return toast('模拟 AI 重放：人工标题、负向约束与发送时间保持不变');case'undo':{let u=db().undo.pop();if(u)Object.assign(db(),JSON.parse(u));return render()}case'fault':state.mode='native';state.fault=true;closeDialog();return render();case'recover':state.mode='derived';state.fault=false;return render();case'conflict':if(plan){db().native[plan.id]='外部修改（模拟）';$('writeError').textContent='已模拟外部旧名变化，执行必须拒绝。'}return;case'execute':if(!plan||!$('consent').checked)return;if(plan.account!==state.account||native(plan.id)!==plan.old){db().audit.push({...plan,status:'CONFLICT'});$('writeError').textContent='未执行：原生标题或账户变化。不会覆盖或重试。';$('execute').disabled=true;return}db().native[plan.id]=plan.next;db().audit.push({...plan,status:'VERIFIED_SIMULATION'});closeDialog();render();return toast('仅模拟改名已记录，真实数据未变化');case'audit':return dialog('模拟回执',`<pre style="white-space:pre-wrap">${esc(JSON.stringify(db().audit,null,2))}</pre>`);case'new':return dialog('实际原生目的地',`<p>主题不合并原生项目上下文。</p><select id="destination">${[...new Set(all().map(c=>c.project))].filter(p=>p!=='未核验来源').map(p=>`<option>${esc(p)}</option>`).join('')}</select><button class="button" data-action="newPreview">查看目的地示意</button>`);case'newPreview':return toast('目的地示意：'+$('destination').value+'。原型不创建真实对话。');case'nativeHelp':return dialog('保留原生 ChatGPT',`<p>原生模型、工具、输入、菜单、Project 和权限仍由 ChatGPT 持有。本页面是模拟，不连接真实功能。</p><p>VAIWL 明确是第三方扩展。当前字体与色值是近似示例，不能当作真实登录态视觉测量。</p>`);case'demoSend':return toast('不发送、不产生用户发送时间；这是交互示意。');default:return}state.limits={};state.expanded={};render()});
document.addEventListener('change',ev=>{if(ev.target.id==='consent')$('execute').disabled=!ev.target.checked});
document.addEventListener('pointerdown',ev=>{if(!$('popover').hidden&&!$('popover').contains(ev.target)&&ev.target!==menuReturn)closeMenu(false)});
document.addEventListener('keydown',ev=>{if(ev.isComposing)return;if(ev.altKey&&ev.key.toLowerCase()==='k'){ev.preventDefault();searchDialog()}if(!$('popover').hidden){let b=[...$('popover').querySelectorAll('button')],i=b.indexOf(document.activeElement);if(['ArrowDown','ArrowUp','Home','End'].includes(ev.key)){ev.preventDefault();b[ev.key==='Home'?0:ev.key==='End'?b.length-1:(i+(ev.key==='ArrowDown'?1:-1)+b.length)%b.length].focus()}if(ev.key==='Escape'){ev.preventDefault();closeMenu()}}});
$('modal').addEventListener('close',()=>{plan=null;if(modalReturn?.isConnected)modalReturn.focus()});
document.addEventListener('dragstart',ev=>{let r=ev.target.closest('[data-drag]');if(r&&state.mode==='derived')ev.dataTransfer.setData('text/plain',r.dataset.drag)});document.addEventListener('dragover',ev=>{if(ev.target.closest('[data-drop]'))ev.preventDefault()});document.addEventListener('drop',ev=>{let t=ev.target.closest('[data-drop]');if(!t)return;ev.preventDefault();let id=ev.dataTransfer.getData('text/plain');if(chat(id))assign(id,t.dataset.drop)});
window.__v2={windowOf,subMonths,localDay,snapshot:()=>JSON.parse(JSON.stringify({state,stores,topics:spaces().map(t=>({...t,status:topicState(t.id),pinned:pinned(t.id),count:items(t.id).length})),chats:all().map(c=>({...c,status:classify(c),display:display(c.id),native:native(c.id),placements:members(c.id)}))})),evaluate:(c)=>classify(c)};
render();
