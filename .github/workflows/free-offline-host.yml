              test "${vaiwl_results[1]}" -eq 0
              vaiwl_source_package="$(node -e "process.stdout.write(require(process.argv[1]).artifactDirectory+'/package/extension')" "$report")"
              node tests/host/ui10-current-use-acceptance.mjs --report "$report" --png-log "$RUNNER_TEMP/populated-native.log" --source-package "$vaiwl_source_package" --expected-sha "$GITHUB_SHA" --output "$RUNNER_TEMP/populated-current-use.json"
              ;;
            visual-components) node tests/host/ui10-visual-paired-browser.mjs "$report" ;;
            existing-source-repair) FREE_CHROME_HEADED=1 xvfb-run -a node tests/host/existing-source-pending-repair-journey.mjs "$report" --execute-browser ;;
            native-entry-safety) node tests/host/native-entry-safety-package-browser.mjs "$report" ;;
            page-command-native-fetch) node tests/host/page-command-native-fetch-package-browser.mjs "$report" ;;
            non-atomic-terminal) node tests/host/non-atomic-terminal-idb-browser.mjs "$report" ;;
            mixed-role|mixed-role-alt|membership-after-message) FREE_EVIDENCE_SCENARIO="$SELECTED_GATE" node tests/host/evidence-order-package-browser.mjs "$report" ;;
            idle-*)
              set +e
              node tests/host/natural-worker-idle-probe.mjs "$report" "${SELECTED_GATE#idle-}"
              result=$?
              set -e
              test "$result" -eq 0 -o "$result" -eq 2
              node -e "const r=require(process.env.RUNNER_TEMP+'/supplementary.json'); if(!['NATURAL_IDLE_NOT_OBSERVED','UNFORCED_TARGET_DESTRUCTION_RECOVERY_PASS'].includes(r.status)||r.naturalWorkerSleep==='PASS'||r.forcedWorkerStop!==false||r.workerDebuggerAttached!==false||r.productionTimersModified!==false||!Number.isFinite(r.observation?.elapsedMs)||r.observation.elapsedMs<60000||r.observation.elapsedMs>90000||r.sourceChangedDuringRun!==false||r.buildManifestUnchanged!==true||r.runnerChangedDuringRun!==false||r.sourceCommit!==process.env.GITHUB_SHA||r.evidenceBinding?.dependenciesUnchanged!==true||r.evidenceBinding?.cleanupVerified!==true||r.evidenceBinding?.sourceCommitBound!==true||r.scenario!==process.env.SELECTED_GATE.slice(5)||r.cleanupErrors?.length) process.exit(1); console.log('Finite observation only; NOT_OBSERVED is not natural-idle acceptance')"
              ;;
            *) exit 1 ;;
          esac
          node -e "const expected={'native-entry-safety':'PASS_LEGACY_SUBSCENARIOS_ONLY','page-command-native-fetch':'PASS_NARROW_PACKAGED_PAGE_COMMAND_AND_NO_TAP_CONTINUITY','non-atomic-terminal':'PASS_D_SCOPED','mixed-role':'PASS_SCOPED_OFFLINE_D_S','mixed-role-alt':'PASS_SCOPED_OFFLINE_D_S','membership-after-message':'PASS_SCOPED_OFFLINE_D_S'}[process.env.SELECTED_GATE];if(expected){const r=require(process.env.RUNNER_TEMP+'/supplementary.json');if(r.status!==expected||r.sourceCommit!==process.env.GITHUB_SHA)process.exit(1)}"
      - name: First-six admission trace after eligible early failure (diagnostic only)
        if: ${{ !cancelled() && matrix.gate == 'populated-native' && steps.formal_supplementary.outcome == 'failure' }}
        run: |
          formal="$RUNNER_TEMP/supplementary.json"
          if test ! -f "$formal"; then
            echo "No formal report; no diagnostic started."
            exit 0
          fi
          set +e
          node tests/host/ui10-admission-trace-outcome.mjs eligible "$formal" "$GITHUB_SHA" "$formal.trace-binding"
          eligibility=$?
          set -e
          if test "$eligibility" -eq 3; then exit 0; fi
          test "$eligibility" -eq 0
          set +e
          FREE_UI10_ADMISSION_TRACE=1 timeout 180s node tests/host/ui10-populated-package-browser.mjs "$RUNNER_TEMP/ui10-admission-trace.json"
          result=$?
          set -e
          test "$result" -eq 2
          node tests/host/ui10-admission-trace-outcome.mjs verify "$RUNNER_TEMP/ui10-admission-trace.json" "$GITHUB_SHA" "$formal" "$result"
      - name: Independent unknown-protocol consumption trace (diagnostic only)
        if: ${{ !cancelled() && matrix.gate == 'fault-unknown-protocol' && steps.formal_supplementary.outcome == 'failure' }}
        run: |
          set +e
          FREE_FAULT_UNKNOWN_TRACE=1 timeout 180s node tests/host/fault-package-matrix-browser.mjs "$RUNNER_TEMP/fault-unknown-trace.json" unknown-protocol
          result=$?
          set -e
          test "$result" -eq 2
          node tests/host/fault-unknown-trace-outcome.mjs "$RUNNER_TEMP/fault-unknown-trace.json" "$result" "$GITHUB_SHA"
      - name: Preserve exact supplementary result in job log
        if: ${{ always() }}
        run: |
          test ! -f "$RUNNER_TEMP/supplementary.json" || cat "$RUNNER_TEMP/supplementary.json"
          test ! -f "$RUNNER_TEMP/populated-current-use.json" || cat "$RUNNER_TEMP/populated-current-use.json"
          test ! -f "$RUNNER_TEMP/fault-unknown-trace.json" || cat "$RUNNER_TEMP/fault-unknown-trace.json"
          test ! -f "$RUNNER_TEMP/ui10-admission-trace.json" || cat "$RUNNER_TEMP/ui10-admission-trace.json"
