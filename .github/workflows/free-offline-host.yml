name: Free offline Host slices (not release acceptance)

on:
  push:
    branches: [codex/vaiwl-free-first-20261013]

permissions:
  contents: read

env:
  FREE_SOURCE_COMMIT: ${{ github.sha }}

concurrency:
  group: free-offline-host-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contracts:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Complete Node contracts including historical writer compatibility
        run: node --test --test-concurrency=2 $(find tests -name '*.test.mjs' -not -path '*/node_modules/*' | sort)
      - name: Twelve isolated guard mutation contracts
        run: node tests/host/guard-mutations.runner.mjs --source-commit "$GITHUB_SHA" --report "$RUNNER_TEMP/guards.json"
  offline-journeys:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Install locked test tools and isolated Chromium
        run: |
          npm ci --prefix tests/b1/tooling --ignore-scripts
          tests/b1/tooling/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from './tests/b1/tooling/node_modules/playwright/index.mjs'; console.log('FREE_CHROME_EXECUTABLE='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Actual packaged C2 conversation slice
        if: ${{ !cancelled() }}
        run: node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-package.json"
      - name: C2 immediate-load cold-start regression (separate result)
        if: ${{ !cancelled() }}
        run: node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-cold.json" cold
      - name: C2 cold passive diagnostic copy (not package acceptance)
        if: ${{ !cancelled() }}
        run: node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-cold-trace.json" cold-trace
      - name: Separate cold safety boundary and genuine native navigation recovery
        if: ${{ !cancelled() }}
        run: node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-cold-recovery.json" cold-recovery
      - name: C2 dormant scope denial and fresh native GET recovery
        if: ${{ !cancelled() }}
        run: node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-dormant.json" dormant-recovery
      - name: Reject permanent-stop dormant recovery mutation
        if: ${{ !cancelled() }}
        run: |
          set +e
          node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-dormant-mutant.json" dormant-recovery-mutant
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const r=require(process.env.RUNNER_TEMP+'/context-dormant-mutant.json'); if(r.status!=='FAIL'||r.mutation!=='RESTORE_PERMANENT_STOP_AFTER_DENIED_WAKE'||r.requests.length!==2||!r.requests.every(q=>q.method==='GET'&&q.status===200)||r.errors.length!==0||r.phase!=='await-fresh-frame-after-native-GET'||r.results.at(-1)?.name!=='denied-wake-withdraws-old-projection-preserves-native-draft'||r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||!r.error?.includes('J2-observation-timeout')) process.exit(1);"
      - name: Foreground expired document transport with genuine live C2 receipt
        if: ${{ !cancelled() }}
        run: |
          node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-transport-expiry.json" transport-expiry
          node -e "const r=require(process.env.RUNNER_TEMP+'/context-transport-expiry.json'); if(r.status!=='PASS_NARROW_OFFLINE_TRANSPORT_EXPIRY'||r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||r.errors.length||r.requests.length!==1||r.requests[0].method!=='GET'||r.requests[0].status!==200||r.nativeRequestStarts.length!==1||r.forcedWorkerStop!==false||r.foregroundRecovery?.newGrant!==true||r.foregroundRecovery?.actualPostFocusVIEW!==true||r.foregroundRecovery?.sameWorker!==true||r.results.at(-1)?.name!=='new-projection-same-nonfirst-team-no-personal-writes') process.exit(1);"
      - name: Reject stale foreground transport without a fresh handshake
        if: ${{ !cancelled() }}
        run: |
          set +e
          node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-transport-expiry-mutant.json" transport-expiry-mutant
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const a=require(process.env.RUNNER_TEMP+'/context-transport-expiry.json'),r=require(process.env.RUNNER_TEMP+'/context-transport-expiry-mutant.json'); if(r.status!=='FAIL'||r.mutation!=='REMOVE_EXACT_FOREGROUND_INVALID_DOCUMENT_RECOVERY'||r.phase!=='await-fresh-foreground-grant-and-VIEW'||!r.error?.includes('J4-peer-current-scope-timeout')||r.results.at(-1)?.name!=='real-dormant-document-lease-expires-with-live-C2-no-renewal-or-native-GET'||r.transportOwner?.workerClosed!==false||!Number.isFinite(r.transportOwner?.focusedAt)||!Number.isFinite(r.transportOwner?.observationEndedAt)||r.transportOwner.observationEndedAt<=r.transportOwner.focusedAt||!r.transport?.some(t=>t.type==='HOST_FOCUS'&&t.requestedAt>r.transportOwner.focusedAt&&t.ok===false&&t.reason==='invalid-host-document')||r.transport?.some(t=>t.type==='HOST_HELLO'&&t.requestedAt>r.transportOwner.focusedAt)||r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||r.errors.length||r.requests.length!==1||r.requests[0].method!=='GET'||r.requests[0].status!==200||r.nativeRequestStarts.length!==1||r.forcedWorkerStop!==false) process.exit(1); for(const k of ['sourceHashes','fixtureHashes']) if(JSON.stringify(a[k])!==JSON.stringify(r[k])) process.exit(1);"
      - name: C2 stale native failure preserves newer receipt with exact guard mutation
        if: ${{ !cancelled() }}
        run: |
          node tests/host/context-stale-request-package-browser.mjs "$RUNNER_TEMP/context-stale.json"
          set +e
          node tests/host/context-stale-request-package-browser.mjs "$RUNNER_TEMP/context-stale-mutant.json" oldguard-mutant
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const a=require(process.env.RUNNER_TEMP+'/context-stale.json'),b=require(process.env.RUNNER_TEMP+'/context-stale-mutant.json'); if(a.status!=='PASS_NARROW_OFFLINE_STALE_NATIVE_TERMINAL'||b.status!=='FAIL'||b.mutation!=='RESTORE_OLD_TERMINAL_GUARD'||b.phase!=='new-projection-survives-old-503'||!b.error?.includes('new-projection-revoked-by-stale-terminal')) process.exit(1); for(const r of [a,b]) if(r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||r.errors.length||JSON.stringify(r.requests.map(q=>[q.method,q.status]))!==JSON.stringify([['GET',200],['GET',200],['GET',503]])) process.exit(1); for(const k of ['sourceHashes','fixtureHashes','nativeOrder']) if(JSON.stringify(a[k])!==JSON.stringify(b[k])) process.exit(1);"
      - name: Continuous J1 candidate journey (partial coverage only)
        if: ${{ !cancelled() }}
        run: |
          set +e
          node tests/host/j1-package-journey.mjs "$RUNNER_TEMP/j1.json"
          result=$?
          set -e
          test "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j1.json'); if(r.status!=='PARTIAL_J1_NOT_ACCEPTED') process.exit(1); console.log(r.status)"
      - name: Continuous J3 explicit historical activity slice
        if: ${{ !cancelled() }}
        run: |
          set +e
          node tests/host/j3-package-journey.mjs "$RUNNER_TEMP/j3.json"
          result=$?
          set -e
          test "$result" -eq 0 -o "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j3.json'); if(!['PASS','PARTIAL_NOT_J3_ACCEPTED'].includes(r.status)) process.exit(1); console.log(r.status)"
      - name: Actual packaged homepage first-send causal slice
        if: ${{ !cancelled() }}
        run: node tests/host/first-send-package-browser.mjs "$RUNNER_TEMP/first-send.json"
      - name: Continuous J2 authenticated ACK and original-time journey
        if: ${{ !cancelled() }}
        run: node tests/host/j2-package-journey.mjs "$RUNNER_TEMP/j2-journey.json"
      - name: Existing conversation immediate retry after native failure
        if: ${{ !cancelled() }}
        run: J2_TERMINAL_MODE=failure node tests/host/j2-fast-retry-package.mjs "$RUNNER_TEMP/j2-fast-failure.json"
      - name: Existing conversation immediate retry after native cancellation
        if: ${{ !cancelled() }}
        run: J2_TERMINAL_MODE=cancelled node tests/host/j2-fast-retry-package.mjs "$RUNNER_TEMP/j2-fast-cancelled.json"
      - name: Packaged profile layout theme and viewport subcontracts
        if: ${{ !cancelled() }}
        run: node tests/host/ui10-package-matrix-browser.mjs "$RUNNER_TEMP/ui10-matrix.json"
      - name: Publish bounded text evidence to logs only
        if: ${{ !cancelled() }}
        run: |
          echo "Source commit: $GITHUB_SHA"
          echo 'This job is slice evidence, not 81-case/J1-J4/real ChatGPT acceptance.'
          for name in context-package context-cold context-cold-trace context-cold-recovery context-dormant context-dormant-mutant context-transport-expiry context-transport-expiry-mutant context-stale context-stale-mutant j1 j3 first-send j2-journey j2-fast-failure j2-fast-cancelled ui10-matrix; do
            if [ -f "$RUNNER_TEMP/$name.json" ]; then cat "$RUNNER_TEMP/$name.json"; fi
          done
  offline-durability-compat:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Install locked test tools and isolated Chromium
        run: |
          npm ci --prefix tests/b1/tooling --ignore-scripts
          tests/b1/tooling/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from './tests/b1/tooling/node_modules/playwright/index.mjs'; console.log('FREE_CHROME_EXECUTABLE='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Real native visibility startup prerequisite
        id: native_visibility
        if: ${{ !cancelled() }}
        run: FREE_CHROME_HEADED=1 xvfb-run -a node tests/host/native-visibility-smoke.mjs "$RUNNER_TEMP/native-visibility.json"
      - name: Real browser and IDB guard mutation counterexamples
        if: ${{ !cancelled() }}
        run: FREE_SOURCE_COMMIT="$GITHUB_SHA" node tests/host/guard-mutations-browser.runner.mjs "$RUNNER_TEMP/guard-browser.json"
      - name: Genuine joint native and ACK IDB cut with designated mutation
        if: ${{ !cancelled() }}
        run: |
          node tests/host/joint-observation-idb-browser.mjs "$RUNNER_TEMP/joint-observation.json"
          set +e
          FREE_JOINT_DROP_CONTINUATION=1 node tests/host/joint-observation-idb-browser.mjs "$RUNNER_TEMP/joint-observation-mutant.json"
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const r=require(process.env.RUNNER_TEMP+'/joint-observation-mutant.json'); if(r.status!=='FAIL'||r.mutation!=='DROP_NATIVE_CONTINUATION'||r.sourceChanged!==false||!r.error?.includes('AssertionError')||!r.error.includes('SYS01_NATIVE_PENDING_ATOMIC')) process.exit(1); console.log('Designated joint atomicity mutation killed; explicit offline authority only')"
      - name: Record unestablished existing-source pending repair probe (not acceptance)
        if: ${{ !cancelled() }}
        run: |
          node tests/host/existing-source-pending-repair-journey.mjs "$RUNNER_TEMP/existing-source-pending-repair.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/existing-source-pending-repair.json'); if(r.status!=='NOT_RUN'||r.S!=='NOT_RUN'||r.sourceCommit!==process.env.GITHUB_SHA||r.fullSYS02!=='NOT_ESTABLISHED'||r.fullJ4!=='NOT_ESTABLISHED'||r.release!=='NOT_RELEASE_READY'||r.scopeFeasibility!=='NOT_ESTABLISHED_NORMAL_SURFACE_CAN_INVALIDATE_NATIVE_WITNESS'||r.steps.length!==0) process.exit(1); console.log('Development probe NOT_RUN; exact source-revoked S and full SYS02 remain NOT_ESTABLISHED')"
      - name: Native IndexedDB pending capacity and transaction fault slice
        if: ${{ !cancelled() }}
        run: node tests/host/sys02-pending-idb-browser.mjs "$RUNNER_TEMP/sys02-pending-idb.json"
      - name: Actual archived Host to current Host asset update
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: FREE_CHROME_HEADED=1 FREE_SOURCE_COMMIT="$GITHUB_SHA" xvfb-run -a node tests/host/historical-host-upgrade.mjs "$RUNNER_TEMP/historical-host.json"
      - name: Actual historical Pro schema compatibility with isolated network guard
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: FREE_CHROME_HEADED=1 FREE_SOURCE_COMMIT="$GITHUB_SHA" xvfb-run -a node tests/host/historical-pro-upgrade.mjs "$RUNNER_TEMP/historical-pro.json"
      - name: Native token stream with authenticated ACK and title (narrow SYS05)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          node tests/host/sys05-stream-package-journey.mjs "$RUNNER_TEMP/sys05-stream.json" --execute-browser
          node -e "const r=require(process.env.RUNNER_TEMP+'/sys05-stream.json'); if(r.status!=='PASS_NARROW_OFFLINE_SYS05_CORRECTNESS'||r.S!=='NARROW_UNINSTRUMENTED_BROWSER_OBSERVED'||r.sourceCommit!==process.env.GITHUB_SHA||r.fullSYS05!=='NOT_ESTABLISHED'||r.workInstrumentation!==false) process.exit(1)"
      - name: Separate instrumented native stream work diagnostic (not performance acceptance)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
        run: |
          node tests/host/sys05-stream-package-journey.mjs "$RUNNER_TEMP/sys05-work.json" --execute-browser --observe-work
          node -e "const r=require(process.env.RUNNER_TEMP+'/sys05-work.json'); if(r.status!=='PASS_NARROW_DIAGNOSTIC_SYS05_SLICE'||r.S!=='NARROW_INSTRUMENTED_BROWSER_OBSERVED'||r.sourceCommit!==process.env.GITHUB_SHA||r.fullSYS05!=='NOT_ESTABLISHED'||r.workInstrumentation!==true||r.F1!=='DIAGNOSTIC_ONLY_NOT_ACCEPTED') process.exit(1)"
      - name: Formal Host 10k single-project membership sample
        id: formal_host_10k
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          set +e
          HOST_SCALE_RUN=1 HOST_SCALE_SIZE=10000 HOST_SCALE_DISTRIBUTION=single-project HOST_SCALE_CPU_RATE=1 node tests/host/host-scale-package-browser.mjs "$RUNNER_TEMP/host-scale-10k-project.json"
          result=$?
          set -e
          test "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/host-scale-10k-project.json'); if(r.status!=='PARTIAL_SYS04_NOT_ACCEPTED'||r.sourceCommit!==process.env.GITHUB_SHA||r.scenario.size!==10000||r.scenario.distribution!=='single-project'||r.measurement?.before?.projectMembership!==10000||r.measurement?.after?.projectMembership!==10000||r.measurement?.status!=='MEASURED_AT_STABLE_ADMITTED_INDEX') process.exit(1); console.log('One admitted 10k exact-project membership sample; no p95 or SYS04 acceptance claim')"
      - name: Failure-only existing 10k worker CPU diagnostic (not acceptance)
        if: ${{ !cancelled() && steps.formal_host_10k.outcome == 'failure' }}
        timeout-minutes: 5
        run: |
          set +e
          FREE_HOST_SCALE_CPU_PROFILE=1 HOST_SCALE_RUN=1 HOST_SCALE_SIZE=10000 HOST_SCALE_DISTRIBUTION=single-project HOST_SCALE_CPU_RATE=1 node tests/host/host-scale-package-browser.mjs "$RUNNER_TEMP/host-scale-10k-cpu-diagnostic.json"
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const r=require(process.env.RUNNER_TEMP+'/host-scale-10k-cpu-diagnostic.json'); if(r.status!=='FAIL'||r.cleanupErrors?.length||r.temporaryDirectoryRemoved!==true||r.sourceCommit!==process.env.GITHUB_SHA||r.acceptance!=='NOT_ESTABLISHED'||r.measurement?.status!=='NOT_RUN_DIAGNOSTIC_WORKER_CPU'||r.workerCPUProfile?.kind!=='DIAGNOSTIC_ONLY_HOST_SCALE_WORKER_CPU'||r.workerCPUProfile?.status!=='CAPTURED'||!r.workerCPUProfile.profile?.samples?.length||r.sourceChangedDuringRun!==false||r.fixtureChangedDuringRun!==false||r.manifestChangedDuringRun!==false) process.exit(1); console.log('Diagnostic sampled a separate existing worker; formal 10k FAIL remains unchanged')"
      - name: Isolated visibility proposal experiment (not production)
        if: ${{ !cancelled() }}
        run: node tests/host/experiments/native-visibility/probe-browser.mjs "$RUNNER_TEMP/visibility-probe.json"
      - name: Publish bounded text evidence to logs only
        if: ${{ !cancelled() }}
        run: |
          echo "Source commit: $GITHUB_SHA"
          echo 'This job is slice evidence, not 81-case/J1-J4/real ChatGPT acceptance.'
          for name in native-visibility guard-browser joint-observation joint-observation-mutant existing-source-pending-repair sys02-pending-idb historical-host historical-pro sys05-stream sys05-work host-scale-10k-project host-scale-10k-cpu-diagnostic visibility-probe; do
            if [ -f "$RUNNER_TEMP/$name.json" ]; then cat "$RUNNER_TEMP/$name.json"; fi
          done

  offline-j4-lifecycle:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Install locked test tools and isolated Chromium
        run: |
          npm ci --prefix tests/b1/tooling --ignore-scripts
          tests/b1/tooling/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from './tests/b1/tooling/node_modules/playwright/index.mjs'; console.log('FREE_CHROME_EXECUTABLE='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: J4 native visibility startup prerequisite
        id: native_visibility
        if: ${{ !cancelled() }}
        run: FREE_CHROME_HEADED=1 xvfb-run -a node tests/host/native-visibility-smoke.mjs "$RUNNER_TEMP/native-visibility.json"
      - name: J2 and J4 prerequisites (partial coverage only)
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: |
          command -v xvfb-run
          set +e
          FREE_CHROME_HEADED=1 xvfb-run -a node tests/host/j2-j4-package-prerequisites.mjs "$RUNNER_TEMP/j2-j4.json"
          result=$?
          set -e
          test "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j2-j4.json'); if(r.status!=='PARTIAL_J2_J4_NOT_ACCEPTED') process.exit(1); console.log(r.status)"
      - name: Continuous J4 context assets and lifecycle slice
        id: j4_journey
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: |
          set +e
          FREE_CHROME_HEADED=1 xvfb-run -a node tests/host/j4-package-journey.mjs "$RUNNER_TEMP/j4-journey.json"
          result=$?
          set -e
          test "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j4-journey.json'); if(r.status!=='PARTIAL_J4_NOT_ACCEPTED') process.exit(1); console.log(r.status)"
      - name: J4 failure-only full lifecycle diagnostic (not acceptance)
