          result=$?
          set -e
          test "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j4-lifecycle-trace.json'); if(r.status!=='DIAGNOSTIC_ONLY_J4_LIFECYCLE_ORDER'||r.sourceCommit!==process.env.GITHUB_SHA) process.exit(1); console.log(r.status)"
      - name: Publish bounded text evidence to logs only
