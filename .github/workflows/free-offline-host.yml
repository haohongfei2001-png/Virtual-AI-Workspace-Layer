name: Free offline Host slices (not release acceptance)

on:
  workflow_dispatch:
    inputs:
      diagnostic:
        description: 'One isolated diagnostic, not full CI or acceptance'
        required: true
        type: choice
        options: [temporary-project-startup, transport-expiry, temporary-navigation-appearance, j4-codec-after-evidence, fault-unknown-protocol, reading-paint-trace, cold-native-recovery, host-delivery-recheck, flow-product-recheck, delivery-blockers-recheck]
  push:
    branches: [codex/vaiwl-free-first-20261013]

permissions:
  contents: read

env:
  FREE_SOURCE_COMMIT: ${{ github.sha }}
  # User priority 2026-10-18: preserve original scale gates; do not run them.
  FREE_SCALE_ACCEPTANCE: DEFERRED

concurrency:
  group: free-offline-host-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-contracts:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Complete Node contracts including historical writer compatibility
        run: node --test --test-concurrency=2 $(find tests -name '*.test.mjs' -not -path '*/node_modules/*' | sort)
      - name: Twelve isolated guard mutation contracts
        run: node tests/host/guard-mutations.runner.mjs --source-commit "$GITHUB_SHA" --report "$RUNNER_TEMP/guards.json"
  offline-journeys:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false && github.ref == 'refs/heads/codex/vaiwl-free-first-20261013' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && (inputs.diagnostic == 'temporary-project-startup' || inputs.diagnostic == 'transport-expiry' || inputs.diagnostic == 'temporary-navigation-appearance' || inputs.diagnostic == 'reading-paint-trace' || inputs.diagnostic == 'cold-native-recovery' || inputs.diagnostic == 'host-delivery-recheck' || inputs.diagnostic == 'flow-product-recheck')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Install locked test tools and isolated Chromium
        run: |
          npm ci --prefix tests/b1/tooling --ignore-scripts
          tests/b1/tooling/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from './tests/b1/tooling/node_modules/playwright/index.mjs'; console.log('FREE_CHROME_EXECUTABLE='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Document-flow native protection and continuous packaged product journey
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.diagnostic == 'reading-paint-trace' || inputs.diagnostic == 'host-delivery-recheck' || inputs.diagnostic == 'flow-product-recheck') }}
        env:
          VAIWL_DELIVERY_RECHECK: ${{ inputs.diagnostic == 'host-delivery-recheck' }}
          VAIWL_FLOW_RECHECK: ${{ inputs.diagnostic == 'flow-product-recheck' }}
        run: |
          if test "$VAIWL_DELIVERY_RECHECK" = true; then
            node --test tests/host/ui10-admission-trace.test.mjs tests/host/ui10-admission-trace-outcome.test.mjs tests/host/offline-ci-partition.test.mjs
            node tests/host/browser-local-mv3.mjs --flow-only --nested-home
            exit 0
          fi
          if test "$VAIWL_FLOW_RECHECK" != true; then
          if test "$GITHUB_EVENT_NAME" = workflow_dispatch; then
            echo 'Original first proof trace diagnostic only; never product acceptance'
            trap 'test ! -f "$RUNNER_TEMP/reading-paint-cpu.json" || cat "$RUNNER_TEMP/reading-paint-cpu.json"' EXIT
            FREE_READING_CPU_PROFILE="$RUNNER_TEMP/reading-paint-cpu.json" node tests/host/document-flow-browser.mjs
            exit 0
          fi
          fi
          node tests/host/document-flow-browser.mjs
          node tests/host/native-invisible-controls-browser.mjs
          node tests/host/native-clipped-controls-browser.mjs
          node tests/host/nested-home-flow-browser.mjs
          node tests/host/document-flow-boundary-browser.mjs "$RUNNER_TEMP/flow-boundary.json"
          node --test tests/host/frame-navigation-hydration-browser.mjs
          FREE_FLOW_READING_REPORT="$RUNNER_TEMP/flow-reading-probe.json" node tests/host/flow-reading-probe-browser.mjs
          FREE_SETTINGS_ARTIFACT_DIR="$RUNNER_TEMP/workspace-settings" node --test tests/host/workspace-settings-browser.mjs
          node tests/host/document-flow-boundary-mv3.mjs "$RUNNER_TEMP/flow-boundary-mv3.json"
          node tests/host/late-current-body-package-browser.mjs "$RUNNER_TEMP/late-current-body.json"
          VAIWL_PROBE_OUTPUT="$RUNNER_TEMP/terminal-delivery.json" node tests/host/terminal-delivery-mv3.mjs all
          node tests/host/browser-local-mv3.mjs --flow-only
          node tests/host/browser-local-mv3.mjs --flow-only --nested-home
      - name: Actual packaged C2 conversation slice
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-package.json"
          node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-container.json" container
      - name: C2 immediate-load cold-start regression (separate result)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-cold.json" cold
      - name: C2 cold passive diagnostic copy (not package acceptance)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set +e
          node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-cold-trace.json" cold-trace
          result=$?
          set -e
          node tests/host/context-cold-trace-outcome.mjs "$RUNNER_TEMP/context-cold-trace.json" "$result"
      - name: Separate cold safety boundary and genuine native navigation recovery
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.diagnostic == 'cold-native-recovery') }}
        run: |
          node --test tests/host/context-cold-recovery-oracle.test.mjs tests/host/context-cold-boundary.test.mjs
          node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-cold-recovery.json" cold-recovery
          node tests/host/context-package-mv3-browser.mjs "$RUNNER_TEMP/context-forced-recovery.json" cold-unavailable-recovery
      - name: C2 dormant scope denial and fresh native GET recovery
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-dormant.json" dormant-recovery
      - name: Reject permanent-stop dormant recovery mutation
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set +e
          node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-dormant-mutant.json" dormant-recovery-mutant
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const r=require(process.env.RUNNER_TEMP+'/context-dormant-mutant.json'); if(r.status!=='FAIL'||r.mutation!=='RESTORE_PERMANENT_STOP_AFTER_DENIED_WAKE'||r.requests.length!==2||!r.requests.every(q=>q.method==='GET'&&q.status===200)||r.errors.length!==0||r.phase!=='await-fresh-frame-after-native-GET'||r.results.at(-1)?.name!=='denied-wake-withdraws-old-projection-preserves-native-draft'||r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||!r.error?.includes('J2-observation-timeout')) process.exit(1);"
      - name: Foreground expired document transport with genuine live C2 receipt
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.diagnostic == 'transport-expiry') }}
        run: |
          node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-transport-expiry.json" transport-expiry
          node -e "const r=require(process.env.RUNNER_TEMP+'/context-transport-expiry.json'); if(r.status!=='PASS_NARROW_OFFLINE_TRANSPORT_EXPIRY'||r.browserPrecondition?.noDefaults!==true||r.browserPrecondition?.focusEmulation!=='NOT_ENABLED_BY_PLAYWRIGHT'||r.foregroundFocusIsolation?.nativeHeadingClicked!==true||r.foregroundFocusIsolation?.composerFocused!==false||r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||r.errors.length||r.requests.length!==1||r.requests[0].method!=='GET'||r.requests[0].status!==200||r.nativeRequestStarts.length!==1||r.forcedWorkerStop!==false||r.foregroundRecovery?.newGrant!==true||r.foregroundRecovery?.actualPostFocusVIEW!==true||r.foregroundRecovery?.sameWorker!==true||r.results.at(-1)?.name!=='new-projection-same-nonfirst-team-no-personal-writes') process.exit(1);"
      - name: Reject stale foreground transport without a fresh handshake
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set +e
          node tests/host/context-replacement-package-browser.mjs "$RUNNER_TEMP/context-transport-expiry-mutant.json" transport-expiry-mutant
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const a=require(process.env.RUNNER_TEMP+'/context-transport-expiry.json'),r=require(process.env.RUNNER_TEMP+'/context-transport-expiry-mutant.json'); if(r.status!=='FAIL'||r.mutation!=='REMOVE_EXACT_FOREGROUND_INVALID_DOCUMENT_RECOVERY'||r.browserPrecondition?.noDefaults!==true||r.browserPrecondition?.focusEmulation!=='NOT_ENABLED_BY_PLAYWRIGHT'||r.foregroundFocusIsolation?.nativeHeadingClicked!==true||r.foregroundFocusIsolation?.composerFocused!==false||r.phase!=='await-fresh-foreground-grant-and-VIEW'||!r.error?.includes('J4-peer-current-scope-timeout')||r.results.at(-1)?.name!=='real-dormant-document-lease-expires-with-live-C2-no-renewal-or-native-GET'||r.transportOwner?.workerClosed!==false||!Number.isFinite(r.transportOwner?.focusedAt)||!Number.isFinite(r.transportOwner?.observationEndedAt)||r.transportOwner.observationEndedAt<=r.transportOwner.focusedAt||!r.transport?.some(t=>t.type==='HOST_FOCUS'&&t.requestedAt>r.transportOwner.focusedAt&&t.ok===false&&t.reason==='invalid-host-document')||r.transport?.some(t=>t.type==='HOST_HELLO'&&t.requestedAt>r.transportOwner.focusedAt)||r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||r.errors.length||r.requests.length!==1||r.requests[0].method!=='GET'||r.requests[0].status!==200||r.nativeRequestStarts.length!==1||r.forcedWorkerStop!==false) process.exit(1); for(const k of ['sourceHashes','fixtureHashes']) if(JSON.stringify(a[k])!==JSON.stringify(r[k])) process.exit(1);"
      - name: C2 stale native failure preserves newer receipt with exact guard mutation
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          node tests/host/context-stale-request-package-browser.mjs "$RUNNER_TEMP/context-stale.json"
          set +e
          node tests/host/context-stale-request-package-browser.mjs "$RUNNER_TEMP/context-stale-mutant.json" oldguard-mutant
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const a=require(process.env.RUNNER_TEMP+'/context-stale.json'),b=require(process.env.RUNNER_TEMP+'/context-stale-mutant.json'); if(a.status!=='PASS_NARROW_OFFLINE_STALE_NATIVE_TERMINAL'||b.status!=='FAIL'||b.mutation!=='RESTORE_OLD_TERMINAL_GUARD'||b.phase!=='new-projection-survives-old-503'||!b.error?.includes('new-projection-revoked-by-stale-terminal')) process.exit(1); for(const r of [a,b]) if(r.sourceChangedDuringRun!==false||r.cleanupErrors?.length||r.errors.length||JSON.stringify(r.requests.map(q=>[q.method,q.status]))!==JSON.stringify([['GET',200],['GET',200],['GET',503]])) process.exit(1); for(const k of ['sourceHashes','fixtureHashes','nativeOrder']) if(JSON.stringify(a[k])!==JSON.stringify(b[k])) process.exit(1);"
      - name: Continuous J1 candidate journey (partial coverage only)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set +e
          node tests/host/j1-package-journey.mjs "$RUNNER_TEMP/j1.json"
          result=$?
          set -e
          test "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j1.json'); if(r.status!=='PARTIAL_J1_NOT_ACCEPTED') process.exit(1); console.log(r.status)"
      - name: Continuous J3 explicit historical activity slice
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          set +e
          node tests/host/j3-package-journey.mjs "$RUNNER_TEMP/j3.json"
          result=$?
          set -e
          test "$result" -eq 0 -o "$result" -eq 2
          node -e "const r=require(process.env.RUNNER_TEMP+'/j3.json'); if(!['PASS','PARTIAL_NOT_J3_ACCEPTED'].includes(r.status)) process.exit(1); console.log(r.status)"
      - name: Actual packaged homepage first-send causal slice
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: node tests/host/first-send-package-browser.mjs "$RUNNER_TEMP/first-send.json"
      - name: Continuous J2 authenticated ACK and original-time journey
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: node tests/host/j2-package-journey.mjs "$RUNNER_TEMP/j2-journey.json"
      - name: Existing conversation immediate retry after native failure
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: J2_TERMINAL_MODE=failure node tests/host/j2-fast-retry-package.mjs "$RUNNER_TEMP/j2-fast-failure.json"
      - name: Existing conversation immediate retry after native cancellation
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: J2_TERMINAL_MODE=cancelled node tests/host/j2-fast-retry-package.mjs "$RUNNER_TEMP/j2-fast-cancelled.json"
      - name: Packaged profile layout theme and viewport subcontracts
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          node tests/host/ui10-package-matrix-browser.mjs "$RUNNER_TEMP/ui10-matrix.json"
          node tests/host/observed-project-mv3-browser.mjs "$RUNNER_TEMP/observed-project-layout.json"
          node tests/host/visible-actions-package-browser.mjs "$RUNNER_TEMP/visible-actions.json"
          FREE_WINDOW_RETENTION_RUN=1 FREE_NAVIGATION_CANCEL_RUN=1 FREE_PANEL_CANCEL_RUN=1 node tests/host/frame-window-retention-package-browser.mjs "$RUNNER_TEMP/frame-window-retention.json"
      - name: Passive local extension status (isolated MV3)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: node tests/host/local-status-package-browser.mjs "$RUNNER_TEMP/local-status.json"
      - name: Temporary native navigation (isolated MV3, no authentication)
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.diagnostic == 'temporary-navigation-appearance') }}
        run: node tests/host/temporary-navigation-package-browser.mjs "$RUNNER_TEMP/temporary-navigation.json"
      - name: Temporary Project navigation (isolated MV3, no authentication)
        if: ${{ !cancelled() && (github.event_name == 'push' || inputs.diagnostic == 'temporary-project-startup') }}
        run: node tests/host/temporary-project-mv3-browser.mjs "$RUNNER_TEMP/temporary-project-navigation.json"
      - name: Challenge status remains fail closed (isolated MV3)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          node tests/host/challenge-status-package-browser.mjs "$RUNNER_TEMP/challenge-status.json"
          node tests/host/preauthorization-package-browser.mjs "$RUNNER_TEMP/preauthorization.json"
      - name: Layout mechanism regressions (not MV3 acceptance)
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          node tests/host/frame-focus-return-browser.mjs "$RUNNER_TEMP/frame-focus-return.json"
          node --test tests/host/recovery-panel-focus-browser.mjs tests/host/frame-renderer-browser.mjs
          node tests/host/reading-viewport-browser.mjs
          node tests/host/return-slot-browser.mjs
          node tests/host/return-gap-browser.mjs
          node tests/host/reading-return-gap-browser.mjs
          node tests/host/history-list-browser.mjs
          node tests/host/observed-profile-browser.mjs
          node tests/host/observed-sidebar-browser.mjs
          node tests/host/observed-project-list-browser.mjs
          node tests/host/observed-project-layout-browser.mjs
          node tests/host/observed-project-masked-browser.mjs
          node tests/host/temporary-project-list-browser.mjs
      - name: Packaged native snippet save search locate and removal
        if: ${{ !cancelled() && github.event_name == 'push' }}
        run: |
          if node tests/host/snippets-package-mv3-browser.mjs "$RUNNER_TEMP/snippets-package.json"; then
            exit 0
          else
            original_result=$?
            timeout 60s node tests/host/snippets-package-mv3-browser.mjs "$RUNNER_TEMP/snippets-startup-trace.json" startup-trace || true
            exit "$original_result"
          fi
      - name: Publish bounded text evidence to logs only
        if: ${{ !cancelled() }}
        run: |
          echo "Source commit: $GITHUB_SHA"
          echo "Event: $GITHUB_EVENT_NAME (workflow_dispatch is diagnostic only, never full CI)"
          echo 'This job is slice evidence, not 81-case/J1-J4/real ChatGPT acceptance.'
          for name in flow-reading-probe flow-boundary flow-boundary-mv3 late-current-body terminal-delivery context-package context-container context-cold context-cold-trace context-cold-recovery context-forced-recovery context-dormant context-dormant-mutant context-transport-expiry context-transport-expiry-mutant context-stale context-stale-mutant j1 j3 first-send j2-journey j2-fast-failure j2-fast-cancelled ui10-matrix visible-actions frame-window-retention frame-focus-return local-status observed-project-layout temporary-navigation temporary-project-navigation challenge-status preauthorization snippets-package snippets-startup-trace; do
            if [ -f "$RUNNER_TEMP/$name.json" ]; then cat "$RUNNER_TEMP/$name.json"; fi
          done
  offline-durability-compat:
    # Public repository + standard GitHub-hosted runner only. No paid runner,
    # artifact/cache upload, credentials, deployment or private host access.
    if: github.repository == 'haohongfei2001-png/Virtual-AI-Workspace-Layer' && github.event.repository.private == false && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Install locked Host build tool
        run: npm ci --prefix extension/tooling --ignore-scripts --no-audit --no-fund
      - name: Install locked test tools and isolated Chromium
        run: |
          npm ci --prefix tests/b1/tooling --ignore-scripts
          tests/b1/tooling/node_modules/.bin/playwright install --with-deps chromium
          node --input-type=module -e "import {chromium} from './tests/b1/tooling/node_modules/playwright/index.mjs'; console.log('FREE_CHROME_EXECUTABLE='+chromium.executablePath())" >> "$GITHUB_ENV"
      - name: Real native visibility startup prerequisite
        id: native_visibility
        if: ${{ !cancelled() }}
        run: FREE_CHROME_HEADED=1 xvfb-run -a node tests/host/native-visibility-smoke.mjs "$RUNNER_TEMP/native-visibility.json"
      - name: Real browser and IDB guard mutation counterexamples
        if: ${{ !cancelled() }}
        run: FREE_SOURCE_COMMIT="$GITHUB_SHA" node tests/host/guard-mutations-browser.runner.mjs "$RUNNER_TEMP/guard-browser.json"
      - name: Populated approved navigation renderer contracts
        if: ${{ !cancelled() }}
        run: |
          trap 'test ! -f "$RUNNER_TEMP/ui10-populated.json" || cat "$RUNNER_TEMP/ui10-populated.json"' EXIT
          node tests/host/ui10-populated-view-browser.mjs "$RUNNER_TEMP/ui10-populated.json"
          cat "$RUNNER_TEMP/ui10-populated.json"
      - name: Recovery deadlines at real IndexedDB final request boundaries
        if: ${{ !cancelled() }}
        run: |
          trap 'test ! -f "$RUNNER_TEMP/recoverydeadline.json" || cat "$RUNNER_TEMP/recoverydeadline.json"' EXIT
          node tests/host/recoverydeadline-browser.mjs "$RUNNER_TEMP/recoverydeadline.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/recoverydeadline.json'); if(r.status!=='PASS'||r.sourcesStable!==true||r.results.length!==52) process.exit(1); console.log(JSON.stringify(r))"
      - name: Genuine joint native and ACK IDB cut with designated mutation
        if: ${{ !cancelled() }}
        run: |
          node tests/host/joint-observation-idb-browser.mjs "$RUNNER_TEMP/joint-observation.json"
          set +e
          FREE_JOINT_DROP_CONTINUATION=1 node tests/host/joint-observation-idb-browser.mjs "$RUNNER_TEMP/joint-observation-mutant.json"
          result=$?
          set -e
          test "$result" -eq 1
          node -e "const r=require(process.env.RUNNER_TEMP+'/joint-observation-mutant.json'); if(r.status!=='FAIL'||r.mutation!=='DROP_NATIVE_CONTINUATION'||r.sourceChanged!==false||!r.error?.includes('AssertionError')||!r.error.includes('SYS01_NATIVE_PENDING_ATOMIC')) process.exit(1); console.log('Designated joint atomicity mutation killed; explicit offline authority only')"
      - name: Record unestablished existing-source pending repair probe (not acceptance)
        if: ${{ !cancelled() }}
        run: |
          node tests/host/existing-source-pending-repair-journey.mjs "$RUNNER_TEMP/existing-source-pending-repair.json"
          node -e "const r=require(process.env.RUNNER_TEMP+'/existing-source-pending-repair.json'); if(r.status!=='NOT_RUN'||r.S!=='NOT_RUN'||r.sourceCommit!==process.env.GITHUB_SHA||r.fullSYS02!=='NOT_ESTABLISHED'||r.fullJ4!=='NOT_ESTABLISHED'||r.release!=='NOT_RELEASE_READY'||r.scopeFeasibility!=='NOT_ESTABLISHED_NORMAL_SURFACE_CAN_INVALIDATE_NATIVE_WITNESS'||r.steps.length!==0) process.exit(1); console.log('Development probe NOT_RUN; exact source-revoked S and full SYS02 remain NOT_ESTABLISHED')"
      - name: Native IndexedDB pending capacity and transaction fault slice
        if: ${{ !cancelled() }}
        run: node tests/host/sys02-pending-idb-browser.mjs "$RUNNER_TEMP/sys02-pending-idb.json"
      - name: Actual archived Host to current Host asset update
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: FREE_CHROME_HEADED=1 FREE_SOURCE_COMMIT="$GITHUB_SHA" xvfb-run -a node tests/host/historical-host-upgrade.mjs "$RUNNER_TEMP/historical-host.json"
      - name: Same-schema installed Host lifecycle codec rollback
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: FREE_HISTORICAL_CODEC=1 FREE_CHROME_HEADED=1 FREE_SOURCE_COMMIT="$GITHUB_SHA" xvfb-run -a node tests/host/historical-host-upgrade.mjs "$RUNNER_TEMP/historical-codec.json"
      - name: Actual historical Pro schema compatibility with isolated network guard
        if: ${{ !cancelled() && steps.native_visibility.outcome == 'success' }}
        run: FREE_CHROME_HEADED=1 FREE_SOURCE_COMMIT="$GITHUB_SHA" xvfb-run -a node tests/host/historical-pro-upgrade.mjs "$RUNNER_TEMP/historical-pro.json"
      - name: Native token stream with authenticated ACK and title (narrow SYS05)
        if: ${{ !cancelled() }}
        timeout-minutes: 3
